name: Release APK

# On demand only: Actions → "Release APK" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.1.0 (leave empty to only upload a workflow artifact)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      # Signing is optional: without the secrets the APK is unsigned (as F-Droid builds it).
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "PRIVEE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 is not set, building an unsigned APK."
          fi

      - name: Build release APK
        env:
          PRIVEE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PRIVEE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PRIVEE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Collect APK
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          name="privee-${{ inputs.tag || github.sha }}.apk"
          cp "$apk" "$name"
          sha256sum "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: privee-release-apk
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256

      - name: Create GitHub release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            "${{ steps.apk.outputs.name }}" "${{ steps.apk.outputs.name }}.sha256" \
            --target "${{ github.sha }}" --title "Privee ${{ inputs.tag }}" --generate-notes
